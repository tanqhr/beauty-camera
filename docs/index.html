<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no,
                   viewport-fit=cover">

    <meta name="theme-color" content="#000000">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent">

    <meta name="apple-mobile-web-app-title"
          content="Beauty Camera">

    <link rel="manifest"
          href="./manifest.json">

    <link rel="stylesheet"
          href="./css/camera.css">

    <title>Beauty Camera</title>
</head>

<body>

<div id="app">

    <!-- =========================
         CAMERA
         ========================= -->

    <video
            id="camera"
            autoplay
            playsinline
            muted>
    </video>


    <canvas id="liveCanvas"></canvas>


    <img
            id="photoPreview"
            alt="Снимка">


    <canvas id="canvas"></canvas>


    <!-- =========================
         TOP BAR
         ========================= -->

    <header class="topbar">

        <div class="brand">
            BEAUTY
        </div>

        <button
                id="flipBtn"
                class="icon-btn"
                type="button"
                aria-label="Смени камерата">

            ↻

        </button>

    </header>


    <!-- =========================
         STATUS
         ========================= -->

    <div id="status"
         class="status">

        Зареждане на камерата...

    </div>


    <!-- =========================
         BEAUTY PANEL
         ========================= -->

    <section class="beauty-panel">


        <!-- CATEGORIES -->

        <div class="categories">

            <button
                    class="category active"
                    data-category="beauty"
                    type="button">

                Beauty

            </button>


            <button
                    class="category"
                    data-category="face"
                    type="button">

                Лице

            </button>


            <button
                    class="category"
                    data-category="nose"
                    type="button">

                Нос

            </button>


            <button
                    class="category"
                    data-category="eyes"
                    type="button">

                Очи

            </button>


            <button
                    class="category"
                    data-category="lips"
                    type="button">

                Устни

            </button>


            <button
                    class="category"
                    data-category="skin"
                    type="button">

                Кожа

            </button>


            <button
                    class="category"
                    data-category="makeup"
                    type="button">

                Makeup

            </button>

        </div>


        <!-- =========================
             BEAUTY
             ========================= -->

        <div
                class="effect-group active"
                data-group="beauty">

            <div class="effect-grid">

                <div class="effect">

                    <label for="beauty">
                        Beauty
                        <span id="beautyValue">50</span>
                    </label>

                    <input
                            id="beauty"
                            type="range"
                            min="0"
                            max="100"
                            value="50">

                </div>


                <div class="effect">

                    <label for="skin">
                        Skin
                        <span id="skinValue">30</span>
                    </label>

                    <input
                            id="skin"
                            type="range"
                            min="0"
                            max="100"
                            value="30">

                </div>


                <div class="effect">

                    <label for="light">
                        Light
                        <span id="lightValue">10</span>
                    </label>

                    <input
                            id="light"
                            type="range"
                            min="-100"
                            max="100"
                            value="10">

                </div>

            </div>

        </div>


        <!-- =========================
             FACE
             ========================= -->

        <div
                class="effect-group"
                data-group="face">

            <div class="effect-grid">

                <div class="effect">
                    <label for="faceSlim">
                        Slim
                        <span id="faceSlimValue">0</span>
                    </label>

                    <input
                            id="faceSlim"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>


                <div class="effect">
                    <label for="jaw">
                        Jaw
                        <span id="jawValue">0</span>
                    </label>

                    <input
                            id="jaw"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>


                <div class="effect">
                    <label for="chin">
                        Chin
                        <span id="chinValue">0</span>
                    </label>

                    <input
                            id="chin"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>


                <div class="effect">
                    <label for="cheeks">
                        Cheeks
                        <span id="cheeksValue">0</span>
                    </label>

                    <input
                            id="cheeks"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>


                <div class="effect">
                    <label for="forehead">
                        Forehead
                        <span id="foreheadValue">0</span>
                    </label>

                    <input
                            id="forehead"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>


                <div class="effect">
                    <label for="contour">
                        Contour
                        <span id="contourValue">0</span>
                    </label>

                    <input
                            id="contour"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>


                <div class="effect">
                    <label for="sculpt">
                        Sculpt
                        <span id="sculptValue">0</span>
                    </label>

                    <input
                            id="sculpt"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>

            </div>

        </div>


        <!-- =========================
             NOSE
             ========================= -->

        <div
                class="effect-group"
                data-group="nose">

            <div class="effect-grid">

                <div class="effect">
                    <label for="nose">
                        Nose
                        <span id="noseValue">0</span>
                    </label>

                    <input
                            id="nose"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>


                <div class="effect">
                    <label for="noseSide">
                        Sides
                        <span id="noseSideValue">0</span>
                    </label>

                    <input
                            id="noseSide"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>


                <div class="effect">
                    <label for="noseTip">
                        Tip
                        <span id="noseTipValue">0</span>
                    </label>

                    <input
                            id="noseTip"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>


                <div class="effect">
                    <label for="noseLift">
                        Lift
                        <span id="noseLiftValue">0</span>
                    </label>

                    <input
                            id="noseLift"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>


                <div class="effect">
                    <label for="noseHeight">
                        Height
                        <span id="noseHeightValue">0</span>
                    </label>

                    <input
                            id="noseHeight"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>

            </div>

        </div>


        <!-- =========================
             EYES
             ========================= -->

        <div
                class="effect-group"
                data-group="eyes">

            <div class="effect-grid">

                <div class="effect">
                    <label for="eyes">
                        Eyes
                        <span id="eyesValue">0</span>
                    </label>

                    <input
                            id="eyes"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>


                <div class="effect">
                    <label for="eyeOpen">
                        Open
                        <span id="eyeOpenValue">0</span>
                    </label>

                    <input
                            id="eyeOpen"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>


                <div class="effect">
                    <label for="eyeLift">
                        Lift
                        <span id="eyeLiftValue">0</span>
                    </label>

                    <input
                            id="eyeLift"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>


                <div class="effect">
                    <label for="underEyes">
                        Under eyes
                        <span id="underEyesValue">0</span>
                    </label>

                    <input
                            id="underEyes"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>


                <div class="effect">
                    <label for="eyeBright">
                        Bright
                        <span id="eyeBrightValue">0</span>
                    </label>

                    <input
                            id="eyeBright"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>

            </div>

        </div>


        <!-- =========================
             LIPS
             ========================= -->

        <div
                class="effect-group"
                data-group="lips">

            <div class="effect-grid">

                <div class="effect">
                    <label for="lips">
                        Lips
                        <span id="lipsValue">0</span>
                    </label>

                    <input
                            id="lips"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>


                <div class="effect">
                    <label for="lipWidth">
                        Width
                        <span id="lipWidthValue">0</span>
                    </label>

                    <input
                            id="lipWidth"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>


                <div class="effect">
                    <label for="upperLip">
                        Upper
                        <span id="upperLipValue">0</span>
                    </label>

                    <input
                            id="upperLip"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>


                <div class="effect">
                    <label for="lowerLip">
                        Lower
                        <span id="lowerLipValue">0</span>
                    </label>

                    <input
                            id="lowerLip"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>


                <div class="effect">
                    <label for="lipCorners">
                        Corners
                        <span id="lipCornersValue">0</span>
                    </label>

                    <input
                            id="lipCorners"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>

            </div>

        </div>


        <!-- =========================
             SKIN
             ========================= -->

        <div
                class="effect-group"
                data-group="skin">

            <div class="effect-grid">

                <div class="effect">
                    <label for="skinSmooth">
                        Smooth
                        <span id="skinSmoothValue">0</span>
                    </label>

                    <input
                            id="skinSmooth"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>


                <div class="effect">
                    <label for="nasolabial">
                        Nasolabial
                        <span id="nasolabialValue">0</span>
                    </label>

                    <input
                            id="nasolabial"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>


                <div class="effect">
                    <label for="mouthLines">
                        Mouth lines
                        <span id="mouthLinesValue">0</span>
                    </label>

                    <input
                            id="mouthLines"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>


                <div class="effect">
                    <label for="foreheadLines">
                        Forehead
                        <span id="foreheadLinesValue">0</span>
                    </label>

                    <input
                            id="foreheadLines"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>

            </div>

        </div>


        <!-- =========================
             MAKEUP
             ========================= -->

        <div
                class="effect-group"
                data-group="makeup">

            <div class="effect-grid">

                <div class="effect">
                    <label for="teeth">
                        Teeth
                        <span id="teethValue">0</span>
                    </label>

                    <input
                            id="teeth"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>


                <div class="effect">
                    <label for="blush">
                        Blush
                        <span id="blushValue">0</span>
                    </label>

                    <input
                            id="blush"
                            type="range"
                            min="0"
                            max="100"
                            value="0">
                </div>

            </div>

        </div>

    </section>


    <!-- =========================
         BOTTOM CONTROLS
         ========================= -->

    <div class="bottom-controls">

        <button
                id="retakeBtn"
                class="side-btn hidden"
                type="button">

            Нова

        </button>


        <button
                id="captureBtn"
                class="capture-btn"
                type="button"
                aria-label="Направи снимка">

            <span></span>

        </button>


        <button
                id="downloadBtn"
                class="side-btn hidden"
                type="button">

            Запази

        </button>

    </div>

</div>


<!-- =========================
     MEDIAPIPE
     ========================= -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.js"></script>


<!-- =========================
     BEAUTY CAMERA JS
     ========================= -->

<script src="./js/face-effects.js"></script>

<script src="./js/face-warp.js"></script>

<script src="./js/camera.js"></script>

</body>
</html>
